name: Refresh GTFS

on:
  schedule:
    - cron: "0 10 * * 1" # Monday 10 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Download latest GTFS
        run: npm run gtfs:fetch

      - name: Check for changes
        id: diff
        run: |
          if [[ -n $(git status --porcelain data/gtfs) ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes 📭"
          fi

      # PRs opened with GITHUB_TOKEN don't trigger other workflows, so test the
      # new feed here. Vercel still builds a preview for the PR.
      - name: Test against the new feed
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci
          npm test

      - name: Commit & open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "caltrain-bot"
          git config user.email "caltrain-bot@users.noreply.github.com"
          BRANCH="gtfs-update-$(date +%F-%H%M%S)"
          git switch -c "$BRANCH"
          git add data/gtfs
          git commit -m "chore: refresh GTFS feed"
          git push --set-upstream origin "$BRANCH"
          gh pr create --fill --base main
